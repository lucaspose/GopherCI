name: gopherci

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: goci
      POSTGRES_PASSWORD: goci
      POSTGRES_DB: goci
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goci -d goci"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://goci:goci@postgres:5432/goci?sslmode=disable
      ARTIFACTS_DIR: /app/artifacts
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  artifacts:
